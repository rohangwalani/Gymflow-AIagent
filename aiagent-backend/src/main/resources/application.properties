spring.application.name=aiagent
server.port=${PORT:8085}
server.address=0.0.0.0
groq.api.key=${GROQ_KEY}
spring.datasource.url=jdbc:postgresql://ep-orange-wave-ahidwjfz.c-3.us-east-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
internal.api.key=${INTERNAL_API_KEY}
jwt.secret=${JWT_SECRET}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=240000