# --- JPA SETTINGS (Optimized) ---
# 1. We REMOVED the 'dialect' line.
# Reason: Hibernate 6 is smart enough to auto-detect PostgreSQL.
# Specifying it manually causes the "HHH90000025" warning you saw.

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 2. Performance Best Practice
# This disables "Open Session In View" to prevent hidden database queries slowing down your app.
spring.jpa.open-in-view=false